<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeux – Sorylokan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&family=Barlow+Condensed:wght@300&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a href="../">Sorylokan</a>
  </nav>

  <h1>Les Jeux de <i>Sorylokan</i></h1>
  <p class="sub">Des jeux de société en ligne, à jouer entre amis dans le navigateur. Pas de compte : un code de salon suffit.</p>

  <!-- Les cartes sont générées par scripts.js à partir des fiches card_*.json.
       Ajouter un jeu = créer card_MONJEU.json + l'ajouter à cards.json. -->
  <ul class="grid" id="catalog"></ul>
  <noscript><p>Activez JavaScript pour afficher le catalogue des jeux.</p></noscript>

  <footer>Les parties se jouent en pair à pair : l'hôte crée un salon et partage le code ou le lien.</footer>
</div>

<script type="module" src="scripts.js"></script>
</body>
</html>
