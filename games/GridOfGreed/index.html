<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid of Greed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Grid of Greed</span>
  <div class="bar-tools">
    <select id="opt-lang" data-i18n-title="bar.lang">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <select id="opt-theme" data-i18n-title="bar.theme">
      <option value="night" data-i18n="theme.night"></option>
      <option value="casino" data-i18n="theme.casino"></option>
      <option value="ruby" data-i18n="theme.ruby"></option>
    </select>
    <button type="button" id="toggle-sound" class="icon-btn" aria-pressed="true" data-i18n-title="bar.sound">
      <svg class="i-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>
</header>

<div class="stage">

<main class="home">
  <h1>Grid of Greed</h1>
  <p class="tagline" data-i18n="app.tagline"></p>

  <form id="join-form" class="panel">
    <label>
      <span data-i18n="app.nameLabel"></span>
      <input id="name" maxlength="24" autocomplete="nickname" data-i18n-ph="app.namePlaceholder">
    </label>
    <button type="button" id="create" data-i18n="app.createRoom"></button>
    <div class="join-row">
      <input id="code" maxlength="9" spellcheck="false" autocomplete="off"
             aria-label="Code" data-i18n-ph="app.joinCodePlaceholder">
      <button type="submit" data-i18n="app.joinRoom"></button>
    </div>
    <p id="home-error" class="error" role="alert" hidden></p>
  </form>
</main>

<main class="lobby" id="lobby" hidden>
  <section class="panel">
    <h2 data-i18n="lobby.title"></h2>
    <div class="copy-row">
      <strong id="lobby-code" class="room-code"></strong>
      <div class="row-btns">
        <button type="button" id="toggle-code" class="icon-btn" aria-pressed="false" data-i18n-title="lobby.showCode">
          <svg class="i-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="i-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button type="button" id="copy-code" class="icon-btn" data-i18n-title="lobby.copyCode">
            <svg class="i-copy" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <svg class="i-ok" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
        </button>
      </div>
    </div>
    <div class="copy-row">
      <span id="lobby-link" class="room-link"></span>
      <button type="button" id="copy-link" class="icon-btn" data-i18n-title="lobby.copyLink">
        <svg class="i-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <svg class="i-ok" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
      </button>
    </div>
    <div class="field">
      <span data-i18n="lobby.seats"></span>
      <div class="stepper">
        <button type="button" id="seats-minus" class="icon-btn" aria-label="−">−</button>
        <output id="seats-val">4</output>
        <button type="button" id="seats-plus" class="icon-btn" aria-label="+">+</button>
      </div>
    </div>
    <label>
      <span data-i18n="lobby.endScore"></span>
      <select id="opt-score">
        <option>50</option><option>100</option><option>150</option><option>200</option>
      </select>
    </label>
  </section>

  <section class="panel">
    <p class="count" id="lobby-count"></p>
    <ul id="lobby-players" class="players"></ul>
    <p id="lobby-hint" class="muted"></p>
    <button type="button" id="start" data-i18n="lobby.start"></button>
  </section>
</main>

<main class="table" id="table" hidden>
  <section class="table-zone"><div class="board" id="board"></div></section>
  <aside class="side">
    <section class="side-card">
      <h3 data-i18n="side.infoTitle"></h3>
      <p id="side-info" class="muted"></p>
    </section>
    <section class="side-card">
      <h3 data-i18n="side.players"></h3>
      <ul id="side-players" class="plist"></ul>
    </section>
    <section class="side-card">
      <h3 data-i18n="side.scores"></h3>
      <div id="side-scores"></div>
    </section>
    <section class="side-card grow">
      <h3 data-i18n="side.history"></h3>
      <div id="side-history"></div>
    </section>
  </aside>
</main>

</div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
