<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B1833">
<title>Mimiri</title>
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Mimiri</span>
  <div class="bar-tools">
    <select id="opt-theme" aria-label="Thème"></select>
    <select id="opt-lang" aria-label="Langue"></select>
  </div>
</header>

<div class="stage">
<main class="game">

  <!-- Colonne de gauche : le thème, l'objectif et les réglages -->
  <section class="panel intro">
    <div>
      <h1 id="title"></h1>
      <p class="tagline" id="goal"></p>
    </div>
    <div class="how">
      <div class="cross" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="hint" id="hint"></p>
    </div>
    <div class="controls">
      <div class="group">
        <span class="group-label" id="sizes-label">Taille de la grille</span>
        <div class="bar" id="sizes"></div>
      </div>
      <div class="actions">
        <button type="button" class="pill" id="btn-daily">Défi du jour</button>
        <button type="button" class="pill ghost" id="btn-new">Nouvelle grille</button>
        <button type="button" class="pill ghost" id="btn-reset">Recommencer</button>
      </div>
    </div>
  </section>

  <!-- Centre : la grille, aussi grande que la place disponible -->
  <section class="board-zone">
    <div id="board" role="group" aria-label="Grille de jeu"></div>
  </section>

  <!-- Colonne de droite : le score en gros chiffres -->
  <section class="panel score">
    <div class="stats">
      <div class="stat"><span id="left-label"></span><b id="left">0</b></div>
      <div class="stat"><span id="moves-label">Coups</span><b id="moves">0</b></div>
      <div class="stat"><span id="best-label">Record</span><b id="best">–</b></div>
    </div>
    <div id="message" aria-live="polite"></div>
  </section>

</main>
</div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
